<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kishore Wall</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shop: {
                            border: "#92D0BD",
                            text: "#008B8B",
                            hover: "#1ec7e6",
                            label: "#20B2AA"
                        }
                    }
                }
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const appList = [
            {
                name: "My First Slate",
                url: "https://play.google.com/store/apps/details?id=com.kish.myfirstslate",
                imageURL: "https://lh3.googleusercontent.com/SEbVclhv-0VGglAo5ytoYF1tJiqZzc61j3I2DiKJ_XQsnOGXgIAv8kWSoNHVFEpCnPqc=w300-rw"
            },
            {
                name: "15 Puzzle",
                url: "https://play.google.com/store/apps/details?id=com.kish.puzzle15",
                imageURL: "https://lh3.googleusercontent.com/om0w9VkkFc-D0X7_LJYI7leU8frW64I9P5Or85ntlOFTjSCy7WQZ931oGHYDPqg8pw=w300-rw"
            },
            {
                name: "Games Den",
                url: "https://play.google.com/store/apps/details?id=com.kish.gamesden",
                imageURL: "https://lh3.googleusercontent.com/vHmdZZJFHQpaQ5z_gHaOj0hr-vGGECOgSs-OjLcB7xYCL1RiLb2P-WbWt4pniXNvd3g=w300-rw"
            },
            {
                name: "Talking Slate",
                url: "https://annamkishore.github.io/TalkingPad/src/web/LearnABC.html",
                imageURL: "https://s3.amazonaws.com/kishorewall/talkingSlate.JPG"
            },
            {
                name: "Talking Pad",
                url: "https://annamkishore.github.io/TalkingPad/src/web/talkingPad.html",
                imageURL: "https://s3.amazonaws.com/kishorewall/talkingPad.JPG"
            },
            {
                name: "Bhagavad Gita",
                url: "https://annamkishore.github.io/bhagavad-gita",
                imageURL: "https://raw.githubusercontent.com/annamkishore/bhagavad-gita/refs/heads/master/public/srikrishna.jpeg"
            }
        ];

        const playStoreApps = appList.slice(0, 3);
        const webApps = appList.slice(3, 6);

        function AppCard({ app }) {
            return (
                <a
                    href={app.url}
                    className="m-2.5 p-2.5 text-shop-text text-lg no-underline border border-shop-border text-center rounded hover:bg-shop-hover"
                >
                    <img className="w-[100px] h-[100px]" src={app.imageURL} alt={app.name} />
                    <div className="mt-2.5">{app.name}</div>
                </a>
            );
        }

        function AppShop({ apps }) {
            return (
                <div className="flex flex-wrap ml-24">
                    {apps.map((app) => (
                        <AppCard key={app.name} app={app} />
                    ))}
                </div>
            );
        }

        function WebLabel() {
            return (
                <div className="mt-8 mb-5 bg-shop-label rounded w-40 p-1.5 text-2xl ml-4">
                    <div className="flex items-center gap-2">
                        <img src="web.ico" className="w-10 h-10" alt="Web" />
                        <span>Web</span>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <>
                    <img
                        src="https://play.google.com/intl/en_us/badges/images/generic/en_badge_web_generic.png"
                        className="w-[200px]"
                        alt="Get it on Google Play"
                    />
                    {/* Play Store apps — currently hidden, matching previous behavior */}
                    {/* <AppShop apps={playStoreApps} /> */}
                    <div className="flex flex-wrap ml-24" />

                    <WebLabel />
                    <AppShop apps={webApps} />
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
